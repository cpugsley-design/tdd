
name: Assignment 5 Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycodestyle matplotlib numpy

      - name: Download ssshtest
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/ryanlayer/ssshtest/master/ssshtest \
            -o ssshtest

      - name: Check PEP 8 style
        run: |
          pycodestyle src/*.py test/unit/*.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s test/unit -p "test_*.py" -v

      - name: Run functional tests
        env:
          MPLBACKEND: Agg
        run: |
          bash test/func/test_fire_gdp.sh
